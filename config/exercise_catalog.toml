#            An alias on several exercises makes that phrase ask "which one?".
# muscles:   main muscle first. Used to answer muscle phrases ("something for my back").
# equipment: one word or two, used in the text the index embeds.
#
# Public JEFIT exercise names, no personal data. Drafted by Claude from general gym
# knowledge, not from evals/search_cases.toml; review and correct freely.

