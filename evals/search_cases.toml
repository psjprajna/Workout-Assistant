# Labelled phrases for find_exercise (scored by scripts/eval_search.py).
#
# expected: exercise ids that count as a right answer (any one of them, in the first
# three options, is a pass). Ids, not names: the database keeps one name per id.
# Noise cases expect nothing to be offered.
#
# Written by Claude from the 154 exercise names in the database, phrased the way people
# talk in a gym. They are not taken from real chat logs: add real phrasings as you meet
# them, and keep this file's cases stable so runs stay comparable.

