# Hand labels for the reply judge: the answer key a judge is compared with.
#
# Each entry is one reply and two yes/no verdicts, given by a person:
#   answers_question: the reply gives what was asked, or correctly asks what is needed.
#   clear_and_brief:  easy to read at a glance, no clutter, nothing repeated.
#
# source = "<file in evals/results>": the reply is looked up there by case and message.
# No reply in the entry: it is not copied, so it cannot drift from the results file.
# source = "made-up": message and reply are written here, on purpose wrong, because the
# real replies are almost all good and a key with no "no" cannot tell a judge that
# checks from one that always says yes.
#
# Labels for the first 15 were given by the owner on 2026-10-22 from agent-2026-10-20-demo.json.
# Entries marked "claude" were labelled by Claude; the owner reviewed them on 2026-10-22.

# --- real replies, current agent: labelled by the owner -----------------------------

