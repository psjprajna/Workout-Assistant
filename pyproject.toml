[project]
name = "workout-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "chainlit>=2.12.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic-ai-slim[openrouter,typesafe]>=2.54.0",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.1",
    # traceloop-sdk (via chainlit -> literalai) imports requests without declaring it
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workout_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "llm: tests that call a real language model (need an API key)",
    "search_eval: search quality gate on your real data and Qdrant index",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.16.10",
]
