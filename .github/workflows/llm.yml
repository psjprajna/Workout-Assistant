name: LLM tests

# Real-model tests cost money, so this runs only when started by hand. Not a PR gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  llm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Same images and host port as docker-compose.yml; the tests read DATABASE_URL defaults.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: workout
          POSTGRES_PASSWORD: workout
          POSTGRES_DB: workout
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U workout"
          --health-interval 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant
        ports:
          - 6333:6333
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.15"
          enable-cache: true
      - run: uv sync --locked --group eval
      # search_eval stays out: it needs the real data and Qdrant index.
      - run: uv run pytest -m "llm and not search_eval"
