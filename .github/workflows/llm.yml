name: LLM tests

# Real-model tests cost money, so this runs only when started by hand. Not a PR gate.
on:
  workflow_dispatch:

jobs:
  llm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Same images and host port as docker-compose.yml; the tests read DATABASE_URL defaults.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: workout
          POSTGRES_PASSWORD: workout
          POSTGRES_DB: workout
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U workout"
          --health-interval 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant
        ports:
          - 6333:6333
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --group eval
      # search_eval stays out: it needs the real data and Qdrant index.
      - run: uv run pytest -m "llm and not search_eval"
