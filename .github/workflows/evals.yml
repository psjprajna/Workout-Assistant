name: Agent evals

# Evals as tests (docs/amendments.md §25): the synthetic cases run against the real model and
# are held to the §9 budgets and evals/baselines/synthetic.json. Real-model calls cost money,
# so this runs only when the model, prompt, cases or dependencies change, weekly to catch
# silent provider or model drift, or by hand. The ordinary CI job runs no model.
on:
  pull_request:
    paths:
      - "src/workout_agent/agents/**"
      - "src/workout_agent/tools/**"
      - "src/workout_agent/evals/**"
      - "src/workout_agent/workflow/**"
      - "evals/baselines/**"
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evals:
    # Pull requests from forks get no secrets, so there is nothing to run them with.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Same images and host port as docker-compose.yml; the tests read DATABASE_URL defaults.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: workout
          POSTGRES_PASSWORD: workout
          POSTGRES_DB: workout
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U workout"
          --health-interval 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant
        ports:
          - 6333:6333
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # The scheduled run also gates latency; pull requests do not (runner timing is noisy).
      EVAL_TIMING: ${{ github.event_name == 'schedule' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.15"
          enable-cache: true
      - run: uv sync --locked --group eval
      - run: uv run pytest -m eval tests/integration/test_agent_eval.py
